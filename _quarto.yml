project:
  type: website
  # hız: gece teması stilleri ancak seçilince insin (bkz. dosyanın açıklaması)
  post-render:
    - _araclar/gece-temasi-ertele.py
  resources:
    - "/.nojekyll"          # / = proje köküne sabit (EN derlemesi _site/ içindekileri kopyalamasın)
    - "/assets/fonts/"
    - "/assets/marka/"
    - "/assets/js/kure.js"
    - "/assets/ekip/"       # araştırmacı fotoğrafları (şablon ham HTML yazdığı için Quarto kendisi bulamaz)
    - "/assets/katex/"      # matematik dizgisi: CDN yerine kendi sunucumuzdan (sürüm sabit, 0.16.22)
    - "/admin/"             # içerik paneli (Sveltia CMS) — derlenmez, olduğu gibi kopyalanır

# Çift dil: Quarto proje profilleri. Varsayılan tr.
#   quarto render                 → _quarto-tr.yml  (Türkçe, _site/)
#   quarto render --profile en    → _quarto-en.yml  (İngilizce, _site/en/)
# Dile özgü her şey (lang, menü, kenar çubukları, alt bilgi, sayfa listesi) profil dosyalarındadır.
profile:
  default: tr
  group:
    - [tr, en]

filters:
  - hero          # _extensions/recep/hero — ana sayfada küre, diğer sayfalarda sade dev başlık

execute:
  freeze: auto   # R çıktıları _freeze/ içine yazılır ve commit edilir; CI'da R gerekmez

website:
  title: "RECEP"           # sekme başlığı son eki ve og:site_name (navbar yazısı ayrı: navbar.title)
  favicon: assets/favicon.svg
  image: assets/og.png
  open-graph: true
  twitter-card: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true
  search:
    location: navbar
    type: overlay
    copy-button: true

  navbar:
    background: dark
    pinned: true
    collapse-below: xxl                    # 8 menü öğesi + dil seçici tek satıra ancak ≥1400 px sığar
    logo: assets/marka/amblem-nav.svg
    logo-alt: "recep amblemi: dünya küresi ve AB–Türkiye bağlantısı"
    title: "recep"

format:
  html:
    theme:
      light: [theme.scss]                   # ilk sıradaki tema varsayılandır: açık (v7)
      dark: [theme.scss, theme-dark.scss]
    respect-user-color-scheme: false
    css: assets/fonts.css
    include-in-header:
      text: |
        <meta name="theme-color" content="#FBFBFD">
        <script>
          // Ana mod açık (v7); gece teması yalnızca oturumluk bir seçenek.
          // Quarto tema seçimini localStorage'a kalıcı yazar: her yeni tarayıcı oturumunun
          // ilk sayfasında bu kaydı sil → site hep gece temasıyla açılır. Oturum içinde
          // (sayfadan sayfaya) düğmeyle seçilen tema korunur.
          try {
            if (!sessionStorage.getItem("recep-oturum")) {
              sessionStorage.setItem("recep-oturum", "1");
              localStorage.removeItem("recep-tema");
              if (localStorage.getItem("quarto-color-scheme")) {
                localStorage.removeItem("quarto-color-scheme");
                location.reload();
              }
            }
          } catch (e) {}
        </script>
    include-after-body:
      text: |
        <script>
          // dönen dünya küresi: sayfa derinliğinden bağımsız yükle
          (function () {
            var m = document.querySelector('meta[name="quarto:offset"]');
            var s = document.createElement("script");
            // ?v= sürüm etiketi: kure.js her değiştiğinde artırın (tarayıcı önbelleği eski betiği tutmasın)
            s.src = (m ? m.content : "./") + "assets/js/kure.js?v=8";
            s.defer = true;
            document.body.appendChild(s);
          })();
          // dil seçici (tr / en): karşı dildeki eşin adresi hero filtresinin yazdığı meta'dan gelir
          (function () {
            var kap = document.querySelector(".navbar .navbar-container");
            if (!kap) return;
            var dil = (document.documentElement.lang || "tr").slice(0, 2) === "en" ? "en" : "tr";
            var m = document.querySelector('meta[name="recep-ceviri"]');
            var o = document.querySelector('meta[name="quarto:offset"]');
            var karsi = m ? m.content : (o ? o.content : "./") + (dil === "en" ? "../index.html" : "en/index.html");
            var d = document.createElement("nav");
            d.className = "recep-dil";
            d.setAttribute("aria-label", dil === "en" ? "Language" : "Dil");
            ["tr", "en"].forEach(function (k, i) {
              if (i) { var ay = document.createElement("span"); ay.textContent = "/"; ay.setAttribute("aria-hidden", "true"); d.appendChild(ay); }
              var a = document.createElement("a");
              a.textContent = k; a.lang = k; a.hreflang = k;
              // etkin dil kendi sayfasını gösterir: href'siz bağlantı arama motorlarınca okunamıyordu
              if (k === dil) { a.className = "aktif"; a.setAttribute("aria-current", "page"); a.href = location.pathname; }
              else { a.href = karsi; a.title = k === "en" ? "English" : "Türkçe"; }
              d.appendChild(a);
            });
            kap.appendChild(d);
            // dar ekranda logo ile ikonlar arasında yer yok: bir kopyası açılır menünün en altında
            var menu = document.querySelector(".navbar .navbar-collapse");
            if (menu) { var k = d.cloneNode(true); k.classList.add("recep-dil--menu"); menu.appendChild(k); }
            // alt bilgi: karşı dildeki eşe sade bir bağlantı
            var altSag = document.querySelector(".nav-footer-right .footer-items");
            if (altSag) {
              var ab = document.createElement("a");
              ab.className = "nav-link"; ab.href = karsi;
              ab.lang = dil === "en" ? "tr" : "en"; ab.hreflang = ab.lang;
              ab.textContent = dil === "en" ? "Türkçe" : "English";
              var li = document.createElement("li"); li.className = "nav-item"; li.appendChild(ab);
              altSag.appendChild(li);
            }
          })();
          // erişilebilirlik: Quarto'nun ürettiği işaretlemede görünümü değiştirmeyen düzeltmeler
          (function () {
            var en = (document.documentElement.lang || "").slice(0, 2) === "en";
            // içeriğe geç bağlantısı (sayfanın ilk odaklanılabilir öğesi)
            var ana = document.querySelector("main");
            if (ana) {
              if (!ana.id) ana.id = "icerik";
              var atla = document.createElement("a");
              atla.className = "recep-atla"; atla.href = "#" + ana.id;
              atla.textContent = en ? "Skip to content" : "İçeriğe geç";
              document.body.insertBefore(atla, document.body.firstChild);
            }
            // marka adı otomatik çeviride bozulmasın
            document.querySelectorAll(".navbar-title, .recep-khero-baslik").forEach(function (e) { e.translate = false; });
            // tarayıcı çubuğu rengi (theme-color) seçili temanın zeminini izlesin
            var tc = document.querySelector('meta[name="theme-color"]');
            var renkGuncelle = function () {
              if (tc) tc.content = getComputedStyle(document.body).backgroundColor || tc.content;
            };
            renkGuncelle();
            new MutationObserver(renkGuncelle).observe(document.body, { attributes: true, attributeFilter: ["class"] });
            // menü düğmesi bir menü değil, açılır paneli kontrol eden düğme
            var t = document.querySelector(".navbar-toggler[role='menu']");
            if (t) t.removeAttribute("role");
            // liste kartları: başlıklar h5 olarak gelir (h2'den sonra seviye atlar) → ekran okuyucuya 3. seviye;
            // kapak görselinde açıklama yoksa kaydın başlığı kullanılır
            document.querySelectorAll(".quarto-grid-item").forEach(function (kart) {
              var b = kart.querySelector(".listing-title");
              if (b) { b.setAttribute("role", "heading"); b.setAttribute("aria-level", "3"); }
              var g = kart.querySelector("img.thumbnail-image:not([alt])");
              if (g) g.alt = b ? b.textContent.trim() : "";
            });
          })();
        </script>
    toc: true
    toc-depth: 3
    # hız (v7 adım 5): kullanılmayan özellikler kapalı → zenscroll, clipboard, tippy/popper yüklenmez.
    # Yumuşak kaydırmayı tarayıcı yapar (theme.scss: scroll-behavior).
    smooth-scroll: false
    anchor-sections: true
    code-copy: false
    code-overflow: wrap
    code-link: false
    footnotes-hover: false
    citations-hover: false
    crossrefs-hover: false
    highlight-style:
      light: github
      dark: github-dark
    html-math-method:
      method: katex
      url: "/assets/katex/"
    link-external-icon: false
    link-external-newwindow: true
    fig-responsive: true
    grid:
      body-width: 780px          # v7: satır ~70 karakter
      sidebar-width: 250px
      margin-width: 230px
