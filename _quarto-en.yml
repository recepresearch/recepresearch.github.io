# English profile: quarto render --profile en  →  _site/en/
# Source pages live in English-named folders (about/, projects/, researchers/, …) + index.en.qmd,
# so they never collide with the Turkish folders.
project:
  output-dir: _site/en
  render:
    - "index.en.qmd"
    - "about/*.qmd"
    - "projects/**/*.qmd"
    - "researchers/*.qmd"
    - "outputs/*.qmd"
    - "data-code/*.qmd"
    - "tools/*.qmd"
    - "conferences-workshops/**/*.qmd"
    - "conferences-workshops/posts/**/*.md"  # entries from the content panel (/admin/)
    - "contact/*.qmd"

lang: en

website:
  description: "RECEP — Environment, Clean Energy and Economic Policies Research Group, Yıldız Technical University."
  site-url: "https://recepresearch.org/en/"

  navbar:
    logo-alt: "recep emblem: globe and EU–Türkiye link"
    left:
      - text: "about"
        href: about/index.qmd
      - text: "projects"
        href: projects/index.qmd
      - text: "researchers"
        href: researchers/index.qmd
      - text: "outputs"
        href: outputs/index.qmd
    right:
      - text: "tools"
        href: tools/index.qmd
      - text: "data & code"
        href: data-code/index.qmd
      - text: "conferences & workshops"
        href: conferences-workshops/index.qmd
      - text: "contact"
        href: contact/index.qmd

  sidebar:
    - id: projects
      title: "projects"
      style: floating
      contents:
        - auto: projects
    - id: outputs
      title: "outputs"
      style: floating
      contents:
        - auto: outputs
    - id: data-code
      title: "data & code"
      style: floating
      contents:
        - auto: data-code
    - id: tools
      title: "tools"
      style: floating
      contents:
        - auto: tools

  page-footer:
    border: true
    # v7: two quiet blocks — name, group and university on the left; contact (+ language link added by _quarto.yml script) on the right
    left: '<span class="recep-alt-ad">© 2026 RECEP</span><span class="recep-alt-satir">Environment, Clean Energy and Economic Policies Research Group</span><span class="recep-alt-satir">Yıldız Technical University</span>'
    right:
      - text: "contact"
        href: contact/index.qmd

format:
  html:
    toc-title: "on this page"
