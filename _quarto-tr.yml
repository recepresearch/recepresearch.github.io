# Türkçe profil (varsayılan): quarto render  →  _site/
project:
  output-dir: _site
  render:
    - "index.qmd"
    - "404.qmd"
    - "hakkimizda/*.qmd"
    - "projeler/**/*.qmd"
    - "arastirmacilar/*.qmd"
    - "ciktilar/*.qmd"
    - "veri-kod/*.qmd"
    - "araclar/*.qmd"
    - "konferans-calistay/**/*.qmd"
    - "konferans-calistay/posts/**/*.md"    # içerik panelinden (/admin/) girilen kayıtlar
    - "iletisim/*.qmd"

lang: tr

website:
  description: "RECEP — Yıldız Teknik Üniversitesi Çevre, Temiz Enerji ve Ekonomi Politikaları Araştırma Grubu."
  site-url: "https://recepresearch.org/"

  navbar:
    left:                                  # merkez logonun solu
      - text: "hakkımızda"
        href: hakkimizda/index.qmd
      - text: "projeler"
        href: projeler/index.qmd
      - text: "araştırmacılar"
        href: arastirmacilar/index.qmd
      - text: "çıktılar"
        href: ciktilar/index.qmd
    right:                                 # merkez logonun sağı
      - text: "araçlar"
        href: araclar/index.qmd
      - text: "veri ve kod"
        href: veri-kod/index.qmd
      - text: "konferans ve çalıştaylar"
        href: konferans-calistay/index.qmd
      - text: "iletişim"
        href: iletisim/index.qmd

  sidebar:
    - id: projeler
      title: "projeler"
      style: floating
      contents:
        - auto: projeler
    - id: ciktilar
      title: "çıktılar"
      style: floating
      contents:
        - auto: ciktilar
    - id: veri-kod
      title: "veri ve kod"
      style: floating
      contents:
        - auto: veri-kod
    - id: araclar
      title: "araçlar"
      style: floating
      contents:
        - auto: araclar

  page-footer:
    border: true
    # v7: iki sakin blok — solda ad, grup ve üniversite; sağda iletişim (+ dil bağlantısı, _quarto.yml betiği ekler)
    left: '<span class="recep-alt-ad">© 2026 RECEP</span><span class="recep-alt-satir">Çevre, Temiz Enerji ve Ekonomi Politikaları Araştırma Grubu</span><span class="recep-alt-satir">Yıldız Teknik Üniversitesi</span>'
    right:
      - text: "iletişim"
        href: iletisim/index.qmd

format:
  html:
    toc-title: "bu sayfada"
